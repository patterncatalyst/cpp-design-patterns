<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="15" y="15" width="1010" height="165" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="27" y="35" font-size="12" font-weight="700" fill="#888">Five GoogleTest/GoogleMock styles (examples/07-testing-with-gtest)</text>
<rect x="15" y="250" width="1010" height="140" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="27" y="270" font-size="12" font-weight="700" fill="#888">CTest discovery and run: the same for every style above</text>
<rect x="30" y="50" width="180" height="110" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="120.0" y="95.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Fixture</text>
<text x="120.0" y="112.5" font-size="11.5" fill="#555555" text-anchor="middle">TEST_F</text>
<text x="120.0" y="127.5" font-size="11.5" fill="#555555" text-anchor="middle">shared state to reset</text>
<rect x="230" y="50" width="180" height="110" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="320.0" y="95.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Parameterized</text>
<text x="320.0" y="112.5" font-size="11.5" fill="#555555" text-anchor="middle">TEST_P</text>
<text x="320.0" y="127.5" font-size="11.5" fill="#555555" text-anchor="middle">one table, many cases</text>
<rect x="430" y="50" width="180" height="110" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="520.0" y="95.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Typed</text>
<text x="520.0" y="112.5" font-size="11.5" fill="#555555" text-anchor="middle">TYPED_TEST_SUITE</text>
<text x="520.0" y="127.5" font-size="11.5" fill="#555555" text-anchor="middle">one contract, many types</text>
<rect x="630" y="50" width="180" height="110" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="720.0" y="95.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Mock / interaction</text>
<text x="720.0" y="112.5" font-size="11.5" fill="#555555" text-anchor="middle">EXPECT_CALL</text>
<text x="720.0" y="127.5" font-size="11.5" fill="#555555" text-anchor="middle">verify the call itself</text>
<rect x="830" y="50" width="180" height="110" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="920.0" y="95.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Death test</text>
<text x="920.0" y="112.5" font-size="11.5" fill="#555555" text-anchor="middle">EXPECT_DEATH</text>
<text x="920.0" y="127.5" font-size="11.5" fill="#555555" text-anchor="middle">abort on bad precondition</text>
<rect x="45" y="290" width="220" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="155.0" y="323.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Test binary</text>
<text x="155.0" y="340.0" font-size="11.5" fill="#555555" text-anchor="middle">testing7_quote_tests</text>
<rect x="285" y="290" width="220" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="395.0" y="323.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">gtest_discover_tests()</text>
<text x="395.0" y="340.0" font-size="11.5" fill="#555555" text-anchor="middle">--gtest_list_tests (JSON)</text>
<rect x="525" y="290" width="220" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="635.0" y="323.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">CTest</text>
<text x="635.0" y="340.0" font-size="11.5" fill="#555555" text-anchor="middle">one add_test() per case</text>
<rect x="765" y="290" width="220" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="875.0" y="323.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ctest --preset cpp23/cpp20</text>
<text x="875.0" y="340.0" font-size="11.5" fill="#555555" text-anchor="middle">pass / fail per case</text>
