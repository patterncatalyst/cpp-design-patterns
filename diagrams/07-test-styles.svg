<text x="521.0" y="319.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">registers</text>
<text x="521.0" y="319.0" font-size="11" fill="#555" text-anchor="middle">registers</text>
<path d="M745,325 L765,325" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="761.0" y="319.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">runs</text>
