<text x="775.0" y="279.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">controls access</text>
<text x="775.0" y="279.0" font-size="11" fill="#b8650a" text-anchor="middle">controls access</text>
<text x="235" y="445" font-size="11" fill="#555555" text-anchor="middle">Order changes behavior: swapping two layers changes what gets cached or logged.</text>
<text x="715" y="385" font-size="11" fill="#555555" text-anchor="middle">A LazyManifestStoreProxy can sit here too, deferring construction until first lookup.</text>
<text x="715" y="445" font-size="11" fill="#555555" text-anchor="middle">Proxy gates one subject; it adds no new behavior to what a lookup returns.</text>
