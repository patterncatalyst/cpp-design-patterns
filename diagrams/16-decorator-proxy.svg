<text x="235.0" y="310.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">LoggingRateSource</text>
<text x="235.0" y="327.5" font-size="11.5" fill="#555555" text-anchor="middle">records each quote call</text>
<rect x="70" y="350" width="330" height="55" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
