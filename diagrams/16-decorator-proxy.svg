<rect x="540" y="210" width="350" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="715.0" y="238.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">AccessControlledManifestProxy</text>
