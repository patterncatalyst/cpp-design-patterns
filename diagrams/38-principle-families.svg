<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="50" width="940" height="420" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="70" font-size="12" font-weight="700" fill="#888">Appendix F: the programming-principle vocabulary</text>
<rect x="40" y="82" width="280" height="170" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="135.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">1. Substitutability (SOLID)</text>
<text x="180.0" y="152.0" font-size="11.5" fill="#555555" text-anchor="middle">SRP</text>
<text x="180.0" y="167.0" font-size="11.5" fill="#555555" text-anchor="middle">OCP</text>
<text x="180.0" y="182.0" font-size="11.5" fill="#555555" text-anchor="middle">LSP</text>
<text x="180.0" y="197.0" font-size="11.5" fill="#555555" text-anchor="middle">ISP</text>
<text x="180.0" y="212.0" font-size="11.5" fill="#555555" text-anchor="middle">DIP</text>
<rect x="350" y="82" width="280" height="170" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="490.0" y="135.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">2. Simplicity and scope</text>
<text x="490.0" y="152.0" font-size="11.5" fill="#555555" text-anchor="middle">KISS</text>
<text x="490.0" y="167.0" font-size="11.5" fill="#555555" text-anchor="middle">YAGNI</text>
<text x="490.0" y="182.0" font-size="11.5" fill="#555555" text-anchor="middle">Simplest thing that works</text>
<text x="490.0" y="197.0" font-size="11.5" fill="#555555" text-anchor="middle">Avoid premature optimization</text>
<text x="490.0" y="212.0" font-size="11.5" fill="#555555" text-anchor="middle">Curly&#x27;s Law (do one thing)</text>
<rect x="660" y="82" width="280" height="170" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="800.0" y="127.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">3. Structure and change</text>
<text x="800.0" y="144.5" font-size="11.5" fill="#555555" text-anchor="middle">DRY</text>
<text x="800.0" y="159.5" font-size="11.5" fill="#555555" text-anchor="middle">Separation of concerns</text>
<text x="800.0" y="174.5" font-size="11.5" fill="#555555" text-anchor="middle">Encapsulate what changes</text>
<text x="800.0" y="189.5" font-size="11.5" fill="#555555" text-anchor="middle">Hide implementation details</text>
<text x="800.0" y="204.5" font-size="11.5" fill="#555555" text-anchor="middle">Composition over inheritance</text>
<text x="800.0" y="219.5" font-size="11.5" fill="#555555" text-anchor="middle">Orthogonality</text>
<rect x="40" y="290" width="280" height="170" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="343.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">4. Coupling and cohesion</text>
<text x="180.0" y="360.0" font-size="11.5" fill="#555555" text-anchor="middle">Minimise coupling</text>
<text x="180.0" y="375.0" font-size="11.5" fill="#555555" text-anchor="middle">Maximise cohesion</text>
<text x="180.0" y="390.0" font-size="11.5" fill="#555555" text-anchor="middle">Law of Demeter</text>
<text x="180.0" y="405.0" font-size="11.5" fill="#555555" text-anchor="middle">Command-Query Separation</text>
<text x="180.0" y="420.0" font-size="11.5" fill="#555555" text-anchor="middle">Inversion of Control</text>
<rect x="350" y="290" width="280" height="170" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="490.0" y="365.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">5. Interoperability and resilience</text>
<text x="490.0" y="382.5" font-size="11.5" fill="#555555" text-anchor="middle">Robustness Principle</text>
<text x="490.0" y="397.5" font-size="11.5" fill="#555555" text-anchor="middle">(Postel&#x27;s Law)</text>
<rect x="660" y="290" width="280" height="170" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="800.0" y="343.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">6. Teams and process (prose only)</text>
<text x="800.0" y="360.0" font-size="11.5" fill="#555555" text-anchor="middle">Boy-Scout Rule</text>
<text x="800.0" y="375.0" font-size="11.5" fill="#555555" text-anchor="middle">Code For The Maintainer</text>
<text x="800.0" y="390.0" font-size="11.5" fill="#555555" text-anchor="middle">Murphy&#x27;s Law</text>
<text x="800.0" y="405.0" font-size="11.5" fill="#555555" text-anchor="middle">Brooks&#x27;s Law</text>
<text x="800.0" y="420.0" font-size="11.5" fill="#555555" text-anchor="middle">Linus&#x27;s Law</text>
<text x="490" y="40" font-size="13" fill="#b8650a" text-anchor="middle" font-weight="700">A principle says WHY; a pattern is a HOW that honors it.</text>
</svg>