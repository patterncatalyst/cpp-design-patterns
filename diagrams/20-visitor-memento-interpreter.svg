<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="20" width="460" height="440" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="40" font-size="12" font-weight="700" fill="#888">Visitor &amp; Interpreter: one fixed AST, three operations</text>
<rect x="500" y="20" width="440" height="440" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="512" y="40" font-size="12" font-weight="700" fill="#888">Memento: whole-state snapshot</text>
<rect x="40" y="130" width="420" height="170" rx="12" fill="#f1f5f9" stroke="#ddd"/>
<text x="52" y="150" font-size="12" font-weight="700" fill="#888">same tree, two representations</text>
<rect x="50" y="55" width="400" height="55" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="250.0" y="80.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Shared rule-node AST</text>
<text x="250.0" y="97.5" font-size="11.5" fill="#555555" text-anchor="middle">WeightAbove · ZoneIs · DeclaredValueAbove · And · Or · Not</text>
<rect x="60" y="165" width="180" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="150.0" y="193.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Classic Visitor</text>
<text x="150.0" y="210.0" font-size="11.5" fill="#555555" text-anchor="middle">class hierarchy, accept()/visit() double dispatch</text>
<rect x="260" y="165" width="180" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="350.0" y="193.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Variant Visitor</text>
<text x="350.0" y="210.0" font-size="11.5" fill="#555555" text-anchor="middle">std::variant + std::visit(Overload{...})</text>
<rect x="130" y="245" width="240" height="45" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="250.0" y="265.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Same match/describe result</text>
<text x="250.0" y="282.5" font-size="11.5" fill="#555555" text-anchor="middle">classic and variant agree on one tree</text>
<rect x="60" y="330" width="380" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="250.0" y="358.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Interpreter</text>
<text x="250.0" y="375.0" font-size="11.5" fill="#555555" text-anchor="middle">walks the same AST to evaluate a grammar expression</text>
<rect x="540" y="60" width="360" height="60" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="720.0" y="88.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">RuleSetEditor (Originator)</text>
<text x="720.0" y="105.0" font-size="11.5" fill="#555555" text-anchor="middle">draft name + named rules + published flag</text>
<rect x="540" y="220" width="360" height="55" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="720.0" y="245.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Snapshot (Memento)</text>
<text x="720.0" y="262.5" font-size="11.5" fill="#555555" text-anchor="middle">opaque deep clone, no internals exposed</text>
<rect x="540" y="330" width="360" height="55" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="720.0" y="355.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Caretaker</text>
<text x="720.0" y="372.5" font-size="11.5" fill="#555555" text-anchor="middle">holds the opaque Snapshot, calls restore() later</text>
<path d="M150,110 L150,165" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="156.0" y="131.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">accept()</text>
<text x="156.0" y="131.5" font-size="11" fill="#555" text-anchor="middle">accept()</text>
<path d="M350,110 L350,165" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="356.0" y="131.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">std::visit()</text>
<text x="356.0" y="131.5" font-size="11" fill="#555" text-anchor="middle">std::visit()</text>
<path d="M150,225 L190,245" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M350,225 L310,245" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M250,290 L250,330" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="256.0" y="304.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">walk again</text>
<text x="256.0" y="304.0" font-size="11" fill="#555" text-anchor="middle">walk again</text>
<path d="M650,120 L650,220" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="656.0" y="164.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">save()</text>
<text x="656.0" y="164.0" font-size="11" fill="#b8650a" text-anchor="middle">save()</text>
<path d="M800,220 L800,120" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="806.0" y="164.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">restore()</text>
<text x="806.0" y="164.0" font-size="11" fill="#b8650a" text-anchor="middle">restore()</text>
<path d="M720,275 L720,330" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="726.0" y="296.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">holds</text>
<text x="726.0" y="296.5" font-size="11" fill="#555" text-anchor="middle">holds</text>
<text x="250" y="425" font-size="11" fill="#888" text-anchor="middle">Nesting of And/Or/Not changes the evaluated result.</text>
<text x="720" y="178" font-size="11" fill="#888" text-anchor="middle">caller mutates the Originator in between</text>
<text x="720" y="425" font-size="11" fill="#888" text-anchor="middle">restore() replaces state wholesale, unlike Chapter 11&#x27;s per-operation Command undo.</text>
</svg>