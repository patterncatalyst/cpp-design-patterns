<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="30" y="35" width="920" height="300" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="42" y="55" font-size="12" font-weight="700" fill="#888">Scope: label_shipment_batch(bay_id)</text>
<rect x="65" y="95" width="200" height="90" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="165.0" y="130.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Acquire</text>
<text x="165.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">DockBayLease ctor:</text>
<text x="165.0" y="162.5" font-size="11.5" fill="#555555" text-anchor="middle">bay marked leased</text>
<rect x="365" y="95" width="200" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="465.0" y="130.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Use</text>
<text x="465.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">labels printed while</text>
<text x="465.0" y="162.5" font-size="11.5" fill="#555555" text-anchor="middle">the bay is held</text>
<rect x="365" y="240" width="200" height="80" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="465.0" y="270.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Exception path</text>
<text x="465.0" y="287.5" font-size="11.5" fill="#555555" text-anchor="middle">a bad barcode throws</text>
<text x="465.0" y="302.5" font-size="11.5" fill="#555555" text-anchor="middle">mid-batch</text>
<rect x="670" y="95" width="200" height="90" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="770.0" y="130.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Release</text>
<text x="770.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">~DockBayLease runs:</text>
<text x="770.0" y="162.5" font-size="11.5" fill="#555555" text-anchor="middle">bay marked free</text>
<path d="M265,140 L365,140" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="321.0" y="134.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">normal path</text>
<text x="321.0" y="134.0" font-size="11" fill="#555" text-anchor="middle">normal path</text>
<path d="M565,140 L670,140" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="623.5" y="134.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">return</text>
<text x="623.5" y="134.0" font-size="11" fill="#555" text-anchor="middle">return</text>
<path d="M455,185 L455,240" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="461.0" y="206.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">throw</text>
<text x="461.0" y="206.5" font-size="11" fill="#555" text-anchor="middle">throw</text>
<path d="M565,270 L770,185" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="673.5" y="221.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">still releases</text>
<text x="673.5" y="221.5" font-size="11" fill="#b8650a" text-anchor="middle">still releases</text>
<text x="490" y="365" font-size="12.5" fill="#64748b" text-anchor="middle">Both paths converge on the same release: the destructor runs no matter how the scope exits.</text>
</svg>