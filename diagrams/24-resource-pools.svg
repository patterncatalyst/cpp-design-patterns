<path d="M455,320 L450,365" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M735,320 L500,365" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="450" y="20" font-size="13" fill="#888" text-anchor="middle" font-weight="700">Resource pools and related concurrency shapes</text>
