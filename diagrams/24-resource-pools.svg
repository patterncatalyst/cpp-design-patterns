<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="30" width="860" height="150" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="50" font-size="12" font-weight="700" fill="#888">Generic pool mechanism (the centerpiece)</text>
<rect x="20" y="210" width="860" height="120" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="230" font-size="12" font-weight="700" fill="#888">Other resource-pool shaped concurrency patterns</text>
<rect x="50" y="75" width="230" height="85" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="165.0" y="108.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ResourcePool&lt;Resource&gt;</text>
<text x="165.0" y="125.0" font-size="11.5" fill="#555555" text-anchor="middle">bounded free list</text>
<text x="165.0" y="140.0" font-size="11.5" fill="#555555" text-anchor="middle">mutex + condition_variable</text>
<rect x="320" y="75" width="230" height="85" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="435.0" y="108.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">PoolLease&lt;Resource&gt;</text>
<text x="435.0" y="125.0" font-size="11.5" fill="#555555" text-anchor="middle">RAII handle</text>
<text x="435.0" y="140.0" font-size="11.5" fill="#555555" text-anchor="middle">returns resource on destruction</text>
<rect x="600" y="75" width="260" height="85" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="730.0" y="108.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">TrackingStoreConnectionPool</text>
<text x="730.0" y="125.0" font-size="11.5" fill="#555555" text-anchor="middle">canonical instance</text>
<text x="730.0" y="140.0" font-size="11.5" fill="#555555" text-anchor="middle">blocking acquire() with timeout</text>
<rect x="50" y="245" width="250" height="75" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="175.0" y="273.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">LabelRenderThreadPool</text>
<text x="175.0" y="290.0" font-size="11.5" fill="#555555" text-anchor="middle">jthread workers drain a task queue</text>
<text x="175.0" y="305.0" font-size="11.5" fill="#555555" text-anchor="middle">renders shipping labels</text>
<rect x="330" y="245" width="250" height="75" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="455.0" y="273.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ShipmentManifestMonitor</text>
<text x="455.0" y="290.0" font-size="11.5" fill="#555555" text-anchor="middle">owns its own mutex</text>
<text x="455.0" y="305.0" font-size="11.5" fill="#555555" text-anchor="middle">public methods serialize</text>
<rect x="610" y="245" width="250" height="75" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="735.0" y="273.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">LabelPrinterActiveObject</text>
<text x="735.0" y="290.0" font-size="11.5" fill="#555555" text-anchor="middle">request queue + own worker thread</text>
<text x="735.0" y="305.0" font-size="11.5" fill="#555555" text-anchor="middle">invocation returns std::future</text>
<rect x="300" y="365" width="300" height="75" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="450.0" y="393.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">C++ Concurrency and Parallelism</text>
<text x="450.0" y="410.0" font-size="11.5" fill="#555555" text-anchor="middle">mutex / condition_variable / jthread</text>
<text x="450.0" y="425.0" font-size="11.5" fill="#555555" text-anchor="middle">memory-model mechanics for all five live there</text>
