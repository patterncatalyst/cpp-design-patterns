<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="15" y="40" width="920" height="270" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="27" y="60" font-size="12" font-weight="700" fill="#888">Same (status, event) rules, encoded three different ways</text>
<rect x="15" y="335" width="920" height="175" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="27" y="355" font-size="12" font-weight="700" fill="#888">The fourth expression: breaks the caller-driven contract</text>
<rect x="40" y="75" width="270" height="205" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="175.0" y="153.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">(a) GoF state pattern</text>
<text x="175.0" y="170.0" font-size="11.5" fill="#555555" text-anchor="middle">Context: GofStateMachine</text>
<text x="175.0" y="185.0" font-size="11.5" fill="#555555" text-anchor="middle">Storage: unique_ptr&lt;ShipmentState&gt;</text>
<text x="175.0" y="200.0" font-size="11.5" fill="#555555" text-anchor="middle">Next state: virtual call -&gt;</text>
<text x="175.0" y="215.0" font-size="11.5" fill="#555555" text-anchor="middle">a new heap state per transition</text>
<rect x="340" y="75" width="270" height="205" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="475.0" y="153.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">(b) Transition table</text>
<text x="475.0" y="170.0" font-size="11.5" fill="#555555" text-anchor="middle">Context: TableShipmentMachine</text>
<text x="475.0" y="185.0" font-size="11.5" fill="#555555" text-anchor="middle">Storage: status_ (plain enum value)</text>
<text x="475.0" y="200.0" font-size="11.5" fill="#555555" text-anchor="middle">Next state: (status, event)</text>
<text x="475.0" y="215.0" font-size="11.5" fill="#555555" text-anchor="middle">lookup in one literal table</text>
<rect x="640" y="75" width="270" height="205" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="775.0" y="153.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">(c) std::variant + std::visit</text>
<text x="775.0" y="170.0" font-size="11.5" fill="#555555" text-anchor="middle">Context: ShipmentVariant value</text>
<text x="775.0" y="185.0" font-size="11.5" fill="#555555" text-anchor="middle">Storage: no heap, closed tag set</text>
<text x="775.0" y="200.0" font-size="11.5" fill="#555555" text-anchor="middle">Next state: Overloaded set</text>
<text x="775.0" y="215.0" font-size="11.5" fill="#555555" text-anchor="middle">dispatched by std::visit</text>
<rect x="225" y="355" width="500" height="140" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="475.0" y="400.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">(d) Stochastic machine</text>
<text x="475.0" y="417.5" font-size="11.5" fill="#555555" text-anchor="middle">Context: StochasticShipmentMachine</text>
<text x="475.0" y="432.5" font-size="11.5" fill="#555555" text-anchor="middle">Storage: status_ + injected std::mt19937</text>
<text x="475.0" y="447.5" font-size="11.5" fill="#555555" text-anchor="middle">Next state: discrete_distribution {0.85 / 0.10 / 0.05}</text>
<text x="475.0" y="462.5" font-size="11.5" fill="#555555" text-anchor="middle">-&gt; outcome</text>
<path d="M310,177 L340,177" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M610,177 L640,177" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="475" y="20" font-size="13" fill="#888" text-anchor="middle" font-weight="700">Figure 10.2: one rule set, four structurally different representations.</text>
</svg>