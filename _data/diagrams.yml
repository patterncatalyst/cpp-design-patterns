# Diagram gallery data for /diagrams/ (name, section, title, caption).
# One entry per paired diagrams/<name>.svg + diagrams/<name>.excalidraw file.

- name: 00-build-and-test-loop
  section: "Ch. 0"
  title: The local build-and-test loop
  caption: >-
    Every example in this book follows the same loop: edit source, resolve
    dependencies with conan install, configure with cmake --preset,
    build with clang, and verify with ctest, then observe the behavior a
    chapter claims. A failing test sends you back to the source. Both
    presets, cpp23 (default) and cpp20 (compat), run this identical loop
    on the host, no containers.

- name: 01-forces-and-decisions
  section: "Ch. 1"
  title: Patterns as decisions under forces
  caption: >-
    The book's arc: recognize the forces, name a candidate pattern (or
    non-pattern), choose the idiomatic C++ expression, test it with gtest,
    and know when not to use it. Forces and trade-offs run under every step.

- name: 02-shared-vocabulary
  section: "Ch. 2"
  title: A pattern name as shared vocabulary
  caption: >-
    A pattern name sits between three readers, a teammate, a future-you, and
    an AI assistant, compressing a cluster of forces and a chosen structure
    into one word all three can act on the same way.

- name: 03-solid-before-after
  section: "Ch. 3"
  title: A billing engine before and after SOLID
  caption: >-
    One Invoice type doing three jobs, split by SRP into three focused types,
    extended by OCP through an InvoiceRule abstraction, and refined by LSP
    without breaking the base contract.

- name: 03-lsp-clamp
  section: "Ch. 3"
  title: The Liskov clamp, an overridable hook inside a sealed sequence
  caption: >-
    A subtotal flows through the overridable discount_rate() hook into a clamp the
    base method owns and never exposes, so every subtype's rate is bounded before
    it reaches the subtotal.

- name: 04-solid-dependency-inversion
  section: "Ch. 4"
  title: Dependency inversion and interface segregation
  caption: >-
    DIP routes a high-level policy through an abstraction instead of straight
    to a concrete gateway, inverting the dependency arrow. ISP splits that
    abstraction into role interfaces a concrete type implements only where it
    has the capability.

- name: 05-raii-lifecycle
  section: "Ch. 5"
  title: "RAII lifecycle: acquire in the constructor, release in the destructor"
  caption: >-
    A thrown exception during use still funnels into the same release point as
    a normal return: the DockBayLease destructor runs during stack unwinding
    exactly as it would on a clean exit, so the resource never stays held past
    the scope that acquired it.

- name: 05-move-ownership-transfer
  section: "Ch. 5"
  title: Move transfers ownership between two guards
  caption: >-
    A move hands ownership from one dock-bay lease to another and flips the source
    to owning nothing, so both objects destruct but the registry releases exactly
    once.

- name: 06-ownership-model
  section: "Ch. 6"
  title: Three ownership kinds in one object graph
  caption: >-
    unique_ptr as a sole owner, shared_ptr as a ref-counted shared owner, and
    weak_ptr observing without owning to break what would otherwise be a
    reference cycle.

- name: 06-value-vs-reference
  section: "Ch. 6"
  title: Value semantics versus reference semantics
  caption: >-
    A copied Parcel stays independent of its original, while two routes sharing one
    CarrierContract both see the change when it is renegotiated once.

- name: 07-test-styles
  section: "Ch. 7"
  title: Five GoogleTest and GoogleMock styles
  caption: >-
    Each style, fixture, parameterized, typed, mock-interaction, and death
    test, answers a different question, and all of them funnel into the same
    CTest discovery and run flow.

- name: 08-strategy-forces
  section: "Ch. 8"
  title: Strategy as a decision under forces
  caption: >-
    A checkout Context holds one interchangeable shipping-cost strategy at
    a time, expressed as runtime polymorphism, a value-semantic
    std::function, or a compile-time concept policy, trading runtime
    flexibility against zero overhead.

- name: 09-template-method-skeleton
  section: "Ch. 9"
  title: Template Method's fixed skeleton and its hooks
  caption: >-
    An order-export pipeline runs a fixed sequence and calls private virtual
    hooks in a fixed order; concrete exporters override the hooks without
    touching the sequence or the validate and trailer invariants.

- name: 10-state-transitions
  section: "Ch. 10"
  title: Shipment states and a stochastic outlet
  caption: >-
    A shipment's legal states and transitions, plus the weighted-probability
    outlet the stochastic machine draws from out of InTransit.

- name: 10-fsm-representations
  section: "Ch. 10"
  title: One rule set, four finite-state-machine representations
  caption: >-
    The same shipment transition rules as a GoF state hierarchy, a transition
    table, a std::variant with std::visit, and a stochastic machine that draws its
    own next state.

- name: 11-command-undo
  section: "Ch. 11"
  title: Command queue and undo/redo stack
  caption: >-
    An invoker drains a FIFO command queue into a receiver, and a
    CommandHistory moves a command between a done stack and an undone stack as
    undo and redo run.

- name: 12-abstract-factory-families
  section: "Ch. 12"
  title: An abstract factory producing two matching carrier families
  caption: >-
    CarrierIntegrationFactory declares a family of three abstract products;
    the FastShip and SummitFreight factories each implement and create their
    own matching family, and the client depends only on the abstractions.

- name: 12-factory-method-flow
  section: "Ch. 12"
  title: Factory Method, a fixed sequence around one varying hook
  caption: >-
    onboard() runs a fixed sequence around the create_test_suite() hook, which the
    sandbox and production onboarders each fill with a different test suite, one
    product decided by environment.

- name: 13-builder-prototype
  section: "Ch. 13"
  title: Builder, prototype registry, and a serialization round trip
  caption: >-
    A builder assembles a manifest behind a fluent interface and validates it
    once at build(); a prototype registry clones a named template into an
    independent copy; and serialize then deserialize round-trips the result
    through plain text.

- name: 14-singleton-vs-di
  section: "Ch. 14"
  title: Singleton versus dependency injection
  caption: >-
    A singleton's clients reach into one global instance directly; the DI
    alternative routes the same capability through an abstraction a composition
    root wires, swappable with a test double.

- name: 15-adapter-facade-bridge
  section: "Ch. 15"
  title: Adapter, Facade, and Bridge side by side
  caption: >-
    Adapter wraps a legacy API behind a target interface; Facade fronts three
    subsystems with one call; Bridge crosses an abstraction axis of refined
    notification kinds with an implementation axis of transports.

- name: 15-bridge-matrix
  section: "Ch. 15"
  title: Bridge, two axes giving N plus M classes instead of N times M
  caption: >-
    Two notification kinds crossed with two transports give four live combinations
    from two small hierarchies, not the class-per-combination explosion a single
    hierarchy would need.

- name: 16-decorator-proxy
  section: "Ch. 16"
  title: Decorator stack and access-controlling proxy
  caption: >-
    A decorator stack (surcharge, caching, logging) wraps a core rate source,
    next to a proxy controlling access to a real manifest store. Both wrap the
    same interface their subject implements; only the intent differs.

- name: 16-decorator-ordering
  section: "Ch. 16"
  title: Decorator order changes the result
  caption: >-
    Reordering the cache and surcharge decorators changes which total a repeat call
    returns, because a cache hit short-circuits before the layer beneath it runs
    again.

- name: 17-composite-flyweight
  section: "Ch. 17"
  title: Composite tree and flyweight pool
  caption: >-
    A composite tree (pallet, cartons, items) sharing one interface on the
    left, and a flyweight pool of SKU descriptors referenced by many line items
    on the right.

- name: 18-observer-mediator
  section: "Ch. 18"
  title: Observer fan-out and a mediator hub
  caption: >-
    A subject fans a status change out to independent observers, next to a
    mediator routing between collaborators that never reference each other
    directly, shown against the tangled direct mesh it replaces.

- name: 19-chain-iterator
  section: "Ch. 19"
  title: A handler chain and an iterator or ranges traversal
  caption: >-
    A request flows down a chain of handlers that each handle or pass, next to
    an aggregate traversed by a hand-written forward iterator and by a filter
    plus transform ranges pipeline over the same data.

- name: 20-visitor-memento-interpreter
  section: "Ch. 20"
  title: Visitor and Interpreter over a shared AST, plus Memento
  caption: >-
    A shared rule-node AST walked two ways, a classic double-dispatch visitor
    and a std::variant plus std::visit visitor producing the same result, with
    an interpreter walking the same AST, next to an editor whose memento
    captures and restores its whole state.

- name: 20-memento-save-restore
  section: "Ch. 20"
  title: Memento, save and restore a whole state through an opaque token
  caption: >-
    The editor saves its whole state into a snapshot a caretaker can hold and
    return but cannot read, and restore() swaps that state back in a single call.

- name: 21-crtp-policy
  section: "Ch. 21"
  title: CRTP and policy-based composition at compile time
  caption: >-
    CRTP resolves a derived type at compile time instead of through a vtable,
    and a policy host is composed from interchangeable compile-time policies the
    same way.

- name: 22-type-erasure-pimpl
  section: "Ch. 22"
  title: Type erasure and a PImpl compilation firewall
  caption: >-
    A value-semantic wrapper erases unrelated concrete types behind a
    hand-written concept and model with no shared base class, next to a class
    that exposes only its header across a PImpl firewall, its implementation
    reachable through nothing but a pointer.

- name: 23-expression-templates
  section: "Ch. 23"
  title: Lazy expression template versus eager evaluation
  caption: >-
    An expression template defers a weighted sum into a tree of scaled and sum
    nodes that evaluates once into a single result, against the eager version
    that builds a new object at every operator.

- name: 23-prototype-registry
  section: "Ch. 23"
  title: A self-registering prototype registry across translation units
  caption: >-
    Each carrier policy's translation unit registers its own prototype at static
    initialization, so a caller resolves a key through the registry and gets back a
    fresh clone with no central file naming any concrete type.

- name: 24-resource-pools
  section: "Ch. 24"
  title: A bounded resource pool and its RAII lease
  caption: >-
    A caller acquires a resource from a bounded pool through an RAII lease that
    returns it on destruction, the shape that also underlies a connection pool, a
    thread pool, a monitor object, and an active object.

- name: 24-threadpool-vs-active-object
  section: "Ch. 24"
  title: Thread pool versus active object, at runtime
  caption: >-
    A thread pool's shared queue serves several workers pulling concurrently, while
    an active object's private queue serves one dedicated worker in submission
    order and the caller never blocks.

- name: 25-dispatch-tables
  section: "Ch. 25"
  title: Three dispatch shortcuts for one message type
  caption: >-
    A shipment message type selects its handler three ways, an enum-indexed
    function-pointer table, an open unordered_map, and a compile-time constexpr
    array, each a lighter stand-in for a Strategy, State, or Command hierarchy.

- name: 26-anti-patterns
  section: "Ch. 26"
  title: Over-patterned design versus the simplified rewrite
  caption: >-
    A singleton registry, a factory-of-factories, and a god object on one side,
    collapsed on the other into one service that takes a settings value by
    injection, which is what makes the rewrite testable in isolation.

- name: 27-seams
  section: "Ch. 27"
  title: Seams make a hard dependency substitutable
  caption: >-
    The same code shown three ways: hard-wired to the wall clock with no seam, an
    object seam that injects a Clock so a test can substitute it, and a link seam
    that swaps a grace-period policy at link time with no object to inject into.

- name: 28-dependency-breaking
  section: "Ch. 28"
  title: Breaking a hard-wired dependency behind an interface
  caption: >-
    A direct call to a concrete collaborator, replaced by an extracted interface
    that both a production implementation and a test double satisfy, so the once
    hard-wired dependency becomes substitutable under test.

- name: 28-instance-delegator
  section: "Ch. 28"
  title: Introduce Instance Delegator over a static API
  caption: >-
    A port and a delegator put a seam in front of an untouched static lookup so a
    new caller can inject a test double, while the legacy call site keeps calling
    the static method directly.

- name: 29-fowler-and-feathers
  section: "Ch. 29"
  title: The combined workflow, Feathers then Fowler
  caption: >-
    A two-stage pipeline: Feathers first to characterize and break dependencies
    into a safety net, then Fowler's named refactorings applied on the now-tested
    code, with the handoff being the point a safety net exists.

- name: 30-refactor-or-rewrite
  section: "Ch. 30"
  title: A strangler fig router behind a stable interface
  caption: >-
    Callers reach a stable pricing interface; a router sends traffic to the legacy
    implementation, the new one, or both in compare mode, shifting customer by
    customer until the new implementation passes the same characterization suite.

- name: 31-final-project
  section: "Ch. 31"
  title: Five patterns composed into one shipment system
  caption: >-
    A shipment dispatcher composes Factory, Strategy, State, Command with undo, and
    Observer, with the events and calls flowing between them: a state transition
    fires observer notifications, a command invokes the factory-built strategy, and
    an undo restores the prior snapshot.

- name: 31-final-project-sequence
  section: "Ch. 31"
  title: The final project's runtime sequence
  caption: >-
    One shipment's run in order across the five composed patterns, with the same
    RateStrategy instance quoting the opening rate and the corrected rate after a
    weight change.

- name: 32-ai-and-llm-tools
  section: "Ch. 32"
  title: The human-AI loop with a verification gate
  caption: >-
    The engineer names the forces and the candidate pattern, an AI drafts an
    implementation, and a verification gate of behavior tests and an idiomatic
    review decides whether the draft is accepted or sent back, keeping
    responsibility for correctness with the engineer.

- name: 38-principle-families
  section: "Appendix F"
  title: The programming-principle vocabulary, grouped into six families
  caption: >-
    Six families of principle: a tight SOLID recap, simplicity and scope,
    structure and change, coupling and cohesion, interoperability and
    resilience, and a process family with no code shape at all, each a
    different angle on the same question of what force justifies a given
    design.
